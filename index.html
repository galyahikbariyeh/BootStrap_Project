<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment-Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container-fluid backImag">
    
        <div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
            <div class="card card-cont">
                <div class="card-body p-4 p-lg-5">
                    <div class="text-center mb-4">
                        <h1 class="h2 fw-semibold mb-1">Settings</h1>
                        <p class="mb-0">Payment</p>
                    </div>
                    <h6 class="fw-bold mb-4">Saved cards:</h6>
                    <div class="row align-items-center">
                        <div class="col-lg-1">
                            <i class="fa-brands fa-cc-mastercard"></i>
    
    
                        </div>
                        <div class="col-lg-8 d-flex">
                            <label class=" fs-6">Card Number</label>
                            <input type="text" class="form-control card-number" value="**** **** **** 4269" readonly>
    
    
    
                        </div>
    
                        <div class="col-lg-3">
                            <a href="#" class="remove-card fs-6 ">
                                Remove card
                            </a>
                        </div>
    
                    </div>
                    <div class="row align-items-center mt-3">
                        <div class="col-lg-1">
                            <i class="fa-brands fa-cc-visa"></i>
    
    
                        </div>
                        <div class="col-lg-8 d-flex">
                            <label class=" fs-6">Card Number</label>
                            <input type="text" class="form-control card-number" value="**** **** **** 3193" readonly>
    
    
    
                        </div>
    
                        <div class="col-lg-3">
                            <a href="#" class="remove-card fs-6 ">
                                Remove card
                            </a>
                        </div>
    
                    </div>
                    <h6 class="fw-bold mb-3 mt-3">Add new card:</h6>
                    <div class="container text-center">
                        <div class="row">
                            <div class="col-12">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control px-5" id="cardholder"
                                        placeholder="Cardholder's Name">
                                    <label for="cardholder">Cardholder's Name</label>
                                </div>
                            </div>
                        </div>
    
                    </div>
                    <div class="row">
    
                        <div class="col-sm">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="cardNumber" placeholder="Card Number">
                                <label for="cardNumber">Card Number</label>
                            </div>
                        </div>
    
                        <div class="col-sm">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="expire" placeholder="MM/YY">
                                <label for="expire">Expire</label>
                            </div>
                        </div>
    
                        <div class="col-sm">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="cvv" placeholder="CVV">
                                <label for="cvv">CVV</label>
                            </div>
                        </div>
    
                    </div>
    
                    <div class="d-grid mt-4">
                        <button type="button" class="btn btn-success add-card-btn py-3 fw-semibold">
                            ADD CARD
                        </button>
                    </div>
                </div>
    
            </div>
        </div>
    
    
    
    
    </div>
    
    
  








        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
